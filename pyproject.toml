[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "autocircuit-mvp"
version = "0.2.0"
description = "Reproducible foundation for automated causal circuit discovery"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "packaging>=24",
  "torch>=2.2",
  "transformer-lens==2.15.4",
  "transformers==4.51.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/autocircuit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: tests that load external models and may require network access"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["autocircuit"]
[[tool.mypy.overrides]]
module = ["torch", "transformer_lens", "transformers"]
ignore_missing_imports = true
