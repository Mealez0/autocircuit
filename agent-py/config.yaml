# Reference defaults for the legacy-compatible agent CLI.
# Runtime values are supplied by CLI flags / environment variables; this file is
# intentionally not auto-loaded so secrets cannot be picked up accidentally.

api:
  base_url: "http://localhost:5004"
  auth_header: "x-secret-key"
  timeout_seconds: 600
  retry_attempts: 0

models:
  default: "google/gemma-2-2b"
  examples:
    - "google/gemma-2-2b"
    - "Qwen/Qwen3-4B"
    - "Qwen/Qwen3-1.7B"  # CRM backend configuration

graph_generation:
  batch_size: 48
  max_n_logits: 10
  desired_logit_prob: 0.95
  node_threshold: 0.8
  edge_threshold: 0.85
  max_feature_nodes: 5000

node_selection:
  max_nodes: 30
  strategy: "pathway"

grouping:
  strategy: "functional"
  # semantic/layer/hybrid currently fall back to functional grouping.

labeling:
  enabled_by_default: false
  # Install requirements-labeling.txt and set ANTHROPIC_API_KEY to opt in.
