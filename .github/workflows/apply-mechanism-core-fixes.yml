name: Apply mechanism core fixes

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-mechanism-core-fixes.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening

      - name: Apply exact mechanism fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"patch drifted for {path}: {old[:100]!r}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/autocircuit/mechanisms.py",
              '_NAME = re.compile(r"^[a-z][a-z0-9_]*$")\n',
              '_NAME = re.compile(r"^[a-z][a-z0-9_]*$")\n_SLUG = re.compile(r"^[a-z][a-z0-9_-]*$")\n',
          )
          replace_once(
              "src/autocircuit/mechanisms.py",
              '''def _text(value: str, label: str) -> str:\n    if not isinstance(value, str) or not value.strip():\n        raise ValueError(f"{label} must be non-empty")\n    return value\n''',
              '''def _slug(value: str, label: str) -> str:\n    if not isinstance(value, str) or not _SLUG.fullmatch(value):\n        raise ValueError(f"{label} must be a lowercase slug")\n    return value\n\n\ndef _text(value: str, label: str) -> str:\n    if not isinstance(value, str) or not value.strip():\n        raise ValueError(f"{label} must be non-empty")\n    return value\n''',
          )
          replace_once(
              "src/autocircuit/mechanisms.py",
              '''            if step.output not in variable_set or any(item not in variable_set for item in step.inputs):\n                raise ValueError("mechanism step references an unknown variable")\n''',
              '''            if step.output not in variable_set or any(\n                item not in variable_set for item in step.inputs\n            ):\n                raise ValueError("mechanism step references an unknown variable")\n''',
          )
          replace_once(
              "src/autocircuit/mechanisms.py",
              '''        _identifier(self.campaign_id, "campaign id")\n''',
              '''        _slug(self.campaign_id, "campaign id")\n''',
          )
          replace_once(
              "src/autocircuit/mechanisms.py",
              '''        if self.selected_layer is not None and (\n            isinstance(self.selected_layer, bool) or self.selected_layer < 0\n        ):\n            raise ValueError("selected layer must be a non-negative integer")\n''',
              '''        if self.selected_layer is not None and (\n            not isinstance(self.selected_layer, int)\n            or isinstance(self.selected_layer, bool)\n            or self.selected_layer < 0\n        ):\n            raise ValueError("selected layer must be a non-negative integer")\n''',
          )
          replace_once(
              "src/autocircuit/mechanism_synthesis.py",
              '''def _entropy(probabilities: list[float]) -> float:\n    return -sum(probability * math.log2(probability) for probability in probabilities if probability)\n''',
              '''def _entropy(probabilities: list[float]) -> float:\n    return -sum(\n        probability * math.log2(probability)\n        for probability in probabilities\n        if probability\n    )\n''',
          )
          replace_once(
              "src/autocircuit/mechanism_synthesis.py",
              '''    candidate_scores: list[tuple[float, float, float, str, MechanismExperiment, dict[str, list[str]]]] = []\n''',
              '''    candidate_scores: list[\n        tuple[float, float, float, str, MechanismExperiment, dict[str, list[str]]]\n    ] = []\n''',
          )
          for path in ("tests/test_mechanisms.py", "tests/test_mechanism_plan.py"):
              replace_once(path, "import pytest\nfrom autocircuit", "import pytest\n\nfrom autocircuit")
          PY
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/mechanisms.py src/autocircuit/mechanism_synthesis.py tests/test_mechanisms.py tests/test_mechanism_plan.py
          git commit -m "Fix mechanism synthesis contracts"
          git push origin HEAD:agent/ci-agent-hardening
