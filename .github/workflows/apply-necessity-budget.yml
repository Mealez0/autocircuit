name: Apply adaptive necessity budget

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-necessity-budget.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening

      - name: Apply fail-closed controller and CLI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path("src/autocircuit/search_controller.py")
          text = controller.read_text(encoding="utf-8")

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              assert value.count(old) == 1, f"{label} drifted; refusing to patch"
              return value.replace(old, new, 1)

          text = replace_once(
              text,
              "    max_path_proposals: int = 2\n    uncertainty_weight: float = 0.5\n",
              "    max_path_proposals: int = 2\n"
              "    max_necessity_proposals: int = 2\n"
              "    uncertainty_weight: float = 0.5\n",
              "policy fields",
          )
          text = replace_once(
              text,
              '            "max_path_proposals": self.max_path_proposals,\n',
              '            "max_path_proposals": self.max_path_proposals,\n'
              '            "max_necessity_proposals": self.max_necessity_proposals,\n',
              "policy validation fields",
          )

          start_marker = "def _necessity_followups("
          end_marker = "\n\ndef _path_proposals("
          assert text.count(start_marker) == 1, "necessity helper start drifted"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_helper = "\n".join(
              [
                  "def _necessity_followups(",
                  "    observations: Sequence[PairObservation], count: int",
                  ") -> list[dict[str, Any]]:",
                  "    stable = [item for item in observations if item.stable_positive]",
                  "    return [",
                  "        {",
                  '            "proposal_id": f"leave_pair_out_{item.pair[0]}_{item.pair[1]}",',
                  '            "kind": "pair_necessity",',
                  '            "mode": "adaptive_follow_up",',
                  '            "heads": list(item.pair),',
                  '            "trigger": "observed_pair_ci_lower_bound_positive",',
                  '            "evidence_status": "proposal_only_not_evidence",',
                  '            "observed_pair_evidence": {',
                  '                "family_specific_advantage": item.advantage,',
                  '                "family_specific_advantage_ci_95": [item.ci_low, item.ci_high],',
                  "            },",
                  "        }",
                  "        for item in stable[:count]",
                  "    ]",
              ]
          )
          text = text[:start] + new_helper + text[end:]

          text = replace_once(
              text,
              "    followups = _necessity_followups(observations)\n",
              "    stable_observed_count = sum(item.stable_positive for item in observations)\n"
              "    followups = _necessity_followups(\n"
              "        observations, selected_policy.max_necessity_proposals\n"
              "    )\n",
              "necessity call",
          )
          text = replace_once(
              text,
              '            "max_path_proposals": selected_policy.max_path_proposals,\n',
              '            "max_path_proposals": selected_policy.max_path_proposals,\n'
              '            "max_necessity_proposals": selected_policy.max_necessity_proposals,\n',
              "serialized policy",
          )
          text = replace_once(
              text,
              '            "observed_head_pairs": len(observed_pairs),\n'
              '            "proposed_head_pairs": proposed_pair_count,\n',
              '            "observed_head_pairs": len(observed_pairs),\n'
              '            "stable_observed_pairs": stable_observed_count,\n'
              '            "proposed_necessity_followups": len(followups),\n'
              '            "necessity_followups_deferred": stable_observed_count - len(followups),\n'
              '            "proposed_head_pairs": proposed_pair_count,\n',
              "search-space counters",
          )
          controller.write_text(text, encoding="utf-8", newline="\n")

          cli = Path("src/autocircuit/search_plan.py")
          text = cli.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '    parser.add_argument("--max-path-proposals", type=int, default=2)\n'
              '    parser.add_argument("--uncertainty-weight", type=float, default=0.5)\n',
              '    parser.add_argument("--max-path-proposals", type=int, default=2)\n'
              '    parser.add_argument("--max-necessity-proposals", type=int, default=2)\n'
              '    parser.add_argument("--uncertainty-weight", type=float, default=0.5)\n',
              "CLI arguments",
          )
          text = replace_once(
              text,
              "            max_path_proposals=args.max_path_proposals,\n"
              "            uncertainty_weight=args.uncertainty_weight,\n",
              "            max_path_proposals=args.max_path_proposals,\n"
              "            max_necessity_proposals=args.max_necessity_proposals,\n"
              "            uncertainty_weight=args.uncertainty_weight,\n",
              "CLI policy construction",
          )
          cli.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Commit adaptive necessity budget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/search_controller.py src/autocircuit/search_plan.py
          git commit -m "Bound adaptive necessity follow-ups"
          git push origin HEAD:agent/ci-agent-hardening
