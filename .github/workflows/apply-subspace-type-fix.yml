name: Apply subspace type fix

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-subspace-type-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Apply exact type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/autocircuit/causal_subspace.py")
          text = path.read_text(encoding="utf-8")
          old = '''        for value in self.singular_values:\n            digest.update(struct.pack("<d", float(value)))\n        digest.update(struct.pack("<d", float(self.between_class_energy_fraction)))\n        for value in self.basis.reshape(-1).tolist():\n            digest.update(struct.pack("<d", float(value)))\n'''
          new = '''        for singular_value in self.singular_values:\n            digest.update(struct.pack("<d", float(singular_value)))\n        digest.update(struct.pack("<d", float(self.between_class_energy_fraction)))\n        for coordinate in self.basis.reshape(-1).tolist():\n            digest.update(struct.pack("<d", float(coordinate)))\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check
      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/causal_subspace.py
          git commit -m "Fix causal subspace fingerprint typing"
          git push origin HEAD:agent/ci-agent-hardening
