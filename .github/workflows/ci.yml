name: CI

on:
  push:
    branches: [main, agent/ci-agent-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install static-analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.9,<1" "mypy>=1.14,<2" "packaging>=24"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        env:
          MYPYPATH: src
        run: python -m mypy --python-version 3.11 src/autocircuit

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight unit-test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "packaging>=24"
          python -m pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q -m "not integration"

  agent-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight agent test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent-py/requirements-dev.txt

      - name: Agent execution contract tests
        env:
          PYTHONPATH: agent-py
        run: pytest -q agent-py/tests
