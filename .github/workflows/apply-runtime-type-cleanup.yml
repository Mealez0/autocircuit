name: Apply runtime type cleanup

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-runtime-type-cleanup.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Apply exact type cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"patch drifted: {path}: {old[:120]!r}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/autocircuit/mechanism_runtime.py",
              '''            donor_sites = (prepared.recipe.hook_site,)\n''',
              '''            donor_sites: tuple[str, ...] = (prepared.recipe.hook_site,)\n''',
          )

          path = "src/autocircuit/mechanism_tlens_runtime.py"
          file = Path(path)
          text = file.read_text(encoding="utf-8")
          text = text.replace("    @torch.inference_mode()\n    def forward(\n", "    def forward(\n", 1)
          old = '''        logits = self.model.run_with_hooks(\n            prompt,\n            fwd_hooks=combined_hooks,\n            return_type="logits",\n        )\n'''
          new = '''        with torch.inference_mode():\n            logits = self.model.run_with_hooks(\n                prompt,\n                fwd_hooks=combined_hooks,\n                return_type="logits",\n            )\n'''
          assert text.count(old) == 1
          file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check
      - name: Commit type cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/mechanism_runtime.py src/autocircuit/mechanism_tlens_runtime.py
          git commit -m "Fix mechanism runtime typing"
          git push origin HEAD:agent/ci-agent-hardening
