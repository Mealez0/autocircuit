name: Apply execution formatting fix

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-execution-format-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Apply exact formatting fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"patch drifted: {path}: {old[:100]!r}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/autocircuit/mechanism_artifacts.py",
              '''    if not isinstance(class_labels, list) or not all(isinstance(label, str) for label in class_labels):\n''',
              '''    if not isinstance(class_labels, list) or not all(\n        isinstance(label, str) for label in class_labels\n    ):\n''',
          )
          replace_once(
              "src/autocircuit/mechanism_artifacts.py",
              '''    if value.get("schema_version") != 1 or value.get("artifact_version") != ALIGNMENT_ARTIFACT_VERSION:\n''',
              '''    if (\n        value.get("schema_version") != 1\n        or value.get("artifact_version") != ALIGNMENT_ARTIFACT_VERSION\n    ):\n''',
          )
          replace_once(
              "src/autocircuit/mechanism_execution.py",
              '''        if not isinstance(topological, list) or tuple(topological) != hypothesis.topological_steps():\n''',
              '''        if (\n            not isinstance(topological, list)\n            or tuple(topological) != hypothesis.topological_steps()\n        ):\n''',
          )
          PY
          git diff --check
      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/mechanism_artifacts.py src/autocircuit/mechanism_execution.py
          git commit -m "Fix mechanism execution formatting"
          git push origin HEAD:agent/ci-agent-hardening
