name: Apply checkpoint helper refactor

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-checkpoint-refactor.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening

      - name: Apply exact checkpoint extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/autocircuit/pipeline.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = '''from autocircuit import __version__
          from autocircuit.artifacts import sha256, verify_resume
          '''
          import_replacement = '''from autocircuit import __version__
          from autocircuit.artifacts import checkpoint as _checkpoint
          from autocircuit.artifacts import sha256, verify_resume
          from autocircuit.artifacts import validate_checkpoints as _validate_checkpoints
          '''
          helper_block = '''def _checkpoint(root: Path, state: dict[str, Any], path: Path) -> None:
              state["artifact_hashes"][str(path.relative_to(root)).replace("\\\\", "/")] = sha256(path)
              _json(root / "run_manifest.json", state)


          def _validate_checkpoints(root: Path, state: dict[str, Any]) -> None:
              for relative, digest in state.get("artifact_hashes", {}).items():
                  verify_resume(root / relative, str(digest))


          '''
          assert text.count(import_anchor) == 1, "artifact import anchor drifted"
          assert text.count(helper_block) == 1, "checkpoint helper block drifted"
          text = text.replace(import_anchor, import_replacement, 1)
          text = text.replace(helper_block, "", 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Commit mechanical checkpoint extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/pipeline.py
          git commit -m "Extract generic checkpoint helpers"
          git push origin HEAD:agent/ci-agent-hardening
