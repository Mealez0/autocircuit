name: Apply mechanism runtime formatting fix

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-runtime-format-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Apply exact formatting fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"patch drifted: {path}: {old[:100]!r}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/autocircuit/mechanism_runtime.py",
              '''                except KeyError as exc:\n                    raise RuntimeError(f"runtime omitted required fitting hook: {exc.args[0]}") from exc\n''',
              '''                except KeyError as exc:\n                    missing = str(exc.args[0])\n                    raise RuntimeError(\n                        f"runtime omitted required fitting hook: {missing}"\n                    ) from exc\n''',
          )
          replace_once(
              "src/autocircuit/mechanism_runtime.py",
              '''                except KeyError as exc:\n                    raise RuntimeError(f"runtime omitted required fitting hook: {mlp_site}") from exc\n''',
              '''                except KeyError as exc:\n                    raise RuntimeError(\n                        f"runtime omitted required fitting hook: {mlp_site}"\n                    ) from exc\n''',
          )
          replace_once(
              "tests/test_mechanism_outcomes.py",
              '''import pytest\nfrom autocircuit.mechanism_outcomes import (\n''',
              '''import pytest\n\nfrom autocircuit.mechanism_outcomes import (\n''',
          )
          PY
          git diff --check
      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/mechanism_runtime.py tests/test_mechanism_outcomes.py
          git commit -m "Fix mechanism runtime formatting"
          git push origin HEAD:agent/ci-agent-hardening
