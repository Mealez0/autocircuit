name: Apply counterfactual formatting fix

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-counterfactual-format-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Apply exact formatting fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"patch drifted: {path}: {old[:100]!r}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/autocircuit/mechanism_counterfactuals.py",
              "from autocircuit.datasets.associative_recall import ExamplePair, TEMPLATES\n",
              "from autocircuit.datasets.associative_recall import TEMPLATES, ExamplePair\n",
          )
          replace_once(
              "src/autocircuit/mechanism_counterfactuals.py",
              '''        [COUNTERFACTUAL_VERSION, example.example_id, example.family_id, kind, donor_query, donor_target],\n''',
              '''        [\n            COUNTERFACTUAL_VERSION,\n            example.example_id,\n            example.family_id,\n            kind,\n            donor_query,\n            donor_target,\n        ],\n''',
          )
          test = Path("tests/test_mechanism_counterfactuals.py")
          text = test.read_text(encoding="utf-8")
          old = '''from autocircuit.mechanism_counterfactuals import (\n    build_counterfactual_manifest,\n    build_discovery_counterfactuals,\n    counterfactual_kind_for_experiment,\n)\nfrom autocircuit.datasets.associative_recall import ExamplePair\n'''
          new = '''from autocircuit.datasets.associative_recall import ExamplePair\nfrom autocircuit.mechanism_counterfactuals import (\n    build_counterfactual_manifest,\n    build_discovery_counterfactuals,\n    counterfactual_kind_for_experiment,\n)\n'''
          assert text.count(old) == 1
          test.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check
      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/mechanism_counterfactuals.py tests/test_mechanism_counterfactuals.py
          git commit -m "Fix counterfactual formatting"
          git push origin HEAD:agent/ci-agent-hardening
