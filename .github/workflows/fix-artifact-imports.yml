name: Fix artifact import formatting

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/fix-artifact-imports.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening

      - name: Apply exact import-only patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/autocircuit/pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''from autocircuit.artifacts import (
              sha256,
              verify_resume,
              write_json as _json,
              write_json_durable as _validation_json,
          )
          '''
          new = '''from autocircuit.artifacts import sha256, verify_resume
          from autocircuit.artifacts import write_json as _json
          from autocircuit.artifacts import write_json_durable as _validation_json
          '''
          assert text.count(old) == 1, "artifact import block drifted; refusing to patch"
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Commit import-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/pipeline.py
          git commit -m "Format extracted artifact imports"
          git push origin HEAD:agent/ci-agent-hardening
