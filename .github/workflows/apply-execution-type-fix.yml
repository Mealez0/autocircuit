name: Apply mechanism parser type fix

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/apply-execution-type-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Apply exact type narrowing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"patch drifted: {path}: {old[:100]!r}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/autocircuit/mechanism_artifacts.py",
              '''    if not all(isinstance(item, str) for item in (alignment_id, variable_name, hook_site)):\n        raise ValueError("activation alignment identity fields are malformed")\n''',
              '''    if not isinstance(alignment_id, str):\n        raise ValueError("activation alignment id is malformed")\n    if not isinstance(variable_name, str):\n        raise ValueError("activation alignment variable name is malformed")\n    if not isinstance(hook_site, str):\n        raise ValueError("activation alignment hook site is malformed")\n''',
          )
          replace_once(
              "src/autocircuit/mechanism_execution.py",
              '''def _string(value: Any, label: str) -> str:\n    if not isinstance(value, str) or not value:\n        raise ValueError(f"{label} must be a non-empty string")\n    return value\n\n\ndef _variables''',
              '''def _string(value: Any, label: str) -> str:\n    if not isinstance(value, str) or not value:\n        raise ValueError(f"{label} must be a non-empty string")\n    return value\n\n\ndef _integer(value: Any, label: str) -> int:\n    if not isinstance(value, int) or isinstance(value, bool):\n        raise ValueError(f"{label} must be an integer")\n    return value\n\n\ndef _variables''',
          )
          replace_once(
              "src/autocircuit/mechanism_execution.py",
              '''            base_target_token_id=raw.get("base_target_token_id"),\n            donor_target_token_id=raw.get("donor_target_token_id"),\n            changed_variables=tuple(changed),\n            prompt_token_length=raw.get("prompt_token_length"),\n''',
              '''            base_target_token_id=_integer(\n                raw.get("base_target_token_id"), "base target token id"\n            ),\n            donor_target_token_id=_integer(\n                raw.get("donor_target_token_id"), "donor target token id"\n            ),\n            changed_variables=tuple(changed),\n            prompt_token_length=_integer(\n                raw.get("prompt_token_length"), "counterfactual prompt token length"\n            ),\n''',
          )
          PY
          git diff --check
      - name: Commit type narrowing fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autocircuit/mechanism_artifacts.py src/autocircuit/mechanism_execution.py
          git commit -m "Harden mechanism artifact parser typing"
          git push origin HEAD:agent/ci-agent-hardening
