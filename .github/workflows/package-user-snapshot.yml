name: Package user snapshot

on:
  push:
    branches: [agent/ci-agent-hardening]
    paths: [.github/workflows/package-user-snapshot.yml]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ci-agent-hardening
      - name: Build clean runnable snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/package-user-snapshot.yml
          printf '%s\n' 'AutoCircuit runnable mechanism-synthesis snapshot' > SNAPSHOT_INFO.txt
          printf '%s\n' 'Source branch: agent/ci-agent-hardening' >> SNAPSHOT_INFO.txt
          printf '%s\n' 'Validated source head before packaging: afb5b3a24c8875a91aa4918cf7fe5701512d873d' >> SNAPSHOT_INFO.txt
          printf '%s\n' 'CI run 31344454056: success' >> SNAPSHOT_INFO.txt
          zip -qr autocircuit-mechanism-latest.zip . -x '.git/*' 'autocircuit-mechanism-latest.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: autocircuit-mechanism-latest
          path: autocircuit-mechanism-latest.zip
          if-no-files-found: error
          retention-days: 1
